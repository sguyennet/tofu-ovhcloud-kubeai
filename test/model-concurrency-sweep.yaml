# Finds the concurrency at which a single model replica saturates, which is the
# number targetRequests should be set from.
#
# The job holds a fixed number of requests in flight, one step at a time, and
# reports the throughput and the latency it measured at each step. Read the
# result as two curves: throughput climbs while the replica still has capacity
# and flattens once it does not, and latency stays flat over the same range and
# then climbs in proportion to the concurrency. The knee is where they cross
# over, and serving beyond it buys no extra work, only a longer wait.
#
# Run it against a single replica, otherwise the load balancer spreads each step
# over several and the curve describes the pool rather than one replica:
#
#   kubectl patch model llama-3.1-8b-instruct-fp8-l4 -n kubeai --type=merge \
#     -p '{"spec":{"maxReplicas":1}}'
#   kubectl apply -f test/model-concurrency-sweep.yaml
#   kubectl logs -n kubeai job/model-sweep -f
#   kubectl delete -f test/model-concurrency-sweep.yaml
#
# Each step runs for STEP_SECONDS and the first SETTLE_SECONDS of it are dropped,
# so that the measurement covers the steady state rather than the ramp.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-sweep
  namespace: kubeai
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: model-sweep
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        pool: control-plane

      containers:
        - name: sweep
          image: python:3.13-alpine

          env:
            - name: KUBEAI_URL
              value: http://kubeai.kubeai.svc.cluster.local/openai/v1/chat/completions
            - name: MODEL
              value: llama-3.1-8b-instruct-fp8-l4
            - name: STEPS
              value: "1,2,4,8,12,16,20,24,32,48,64"
            - name: STEP_SECONDS
              value: "90"
            - name: SETTLE_SECONDS
              value: "30"
            - name: MAX_TOKENS
              value: "256"

          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          command: ["python3", "-c"]
          args:
            - |
              import json
              import os
              import threading
              import time
              import urllib.request

              url = os.environ["KUBEAI_URL"]
              steps = [int(s) for s in os.environ["STEPS"].split(",")]
              step_seconds = int(os.environ["STEP_SECONDS"])
              settle_seconds = int(os.environ["SETTLE_SECONDS"])

              body = json.dumps({
                  "model": os.environ["MODEL"],
                  "messages": [{
                      "role": "user",
                      "content": "Explain in three paragraphs how an autoscaler "
                                 "decides to add a replica.",
                  }],
                  "max_tokens": int(os.environ["MAX_TOKENS"]),
                  "temperature": 0.7,
              }).encode()

              lock = threading.Lock()
              measuring = False
              samples = []
              failed = 0


              def worker(deadline):
                  global failed
                  while time.time() < deadline:
                      started = time.time()
                      request = urllib.request.Request(
                          url, data=body,
                          headers={"Content-Type": "application/json"})
                      try:
                          with urllib.request.urlopen(request, timeout=300) as answer:
                              payload = json.loads(answer.read())
                          elapsed = time.time() - started
                          tokens = payload["usage"]["completion_tokens"]
                      except Exception:
                          with lock:
                              failed += 1
                          continue
                      with lock:
                          if measuring:
                              samples.append((elapsed, tokens))


              print("%12s %10s %10s %12s %12s"
                    % ("concurrency", "answers/s", "tokens/s",
                       "latency", "per request"), flush=True)

              for concurrency in steps:
                  deadline = time.time() + step_seconds
                  threads = [threading.Thread(target=worker, args=(deadline,),
                                              daemon=True)
                             for _ in range(concurrency)]
                  for thread in threads:
                      thread.start()

                  time.sleep(settle_seconds)
                  with lock:
                      del samples[:]
                      measuring = True
                  window_started = time.time()

                  for thread in threads:
                      thread.join(timeout=step_seconds + 310)
                  window = time.time() - window_started
                  with lock:
                      measuring = False
                      measured = samples[:]
                      del samples[:]

                  answers = len(measured)
                  latency = sum(s[0] for s in measured) / answers if answers else 0
                  tokens = sum(s[1] for s in measured)
                  # Tokens per second for one request, the speed a user perceives.
                  each = tokens / sum(s[0] for s in measured) if answers else 0
                  print("%12d %10.2f %10.1f %11.1fs %8.1f tok/s"
                        % (concurrency, answers / window, tokens / window,
                           latency, each), flush=True)

              print("failed=%d" % failed, flush=True)
